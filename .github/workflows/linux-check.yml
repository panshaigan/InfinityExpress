name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev xvfb xauth dbus-x11 imagemagick xdotool webkit2gtk-driver minisign patchelf xdg-utils
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:coverage:rust
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-linux
          path: coverage/
          if-no-files-found: error
      - name: Verify bundled native WeiDU
        run: |
          test -x src-tauri/resources/weidu/linux-amd64/weidu
          src-tauri/resources/weidu/linux-amd64/weidu --version
          python3 scripts/linux/weidu-smoke.py
      - name: Build unsigned Linux Debian package
        run: npm run tauri:build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check package contents and desktop startup
        run: bash scripts/linux/package-smoke.sh
      - name: Verify AppImage updater signing with disposable keys
        run: bash scripts/linux/signing-smoke.sh
      - name: Check AppImage startup and native commands
        run: bash scripts/linux/appimage-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debian-test-build
          path: .cache/linux-check/
          if-no-files-found: error
