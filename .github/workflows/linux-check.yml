name: Linux checks

on:
  push:
    branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ runner.os }}
          workspaces: |
            src-tauri -> target
            src-tauri -> target/llvm-cov-target
          cache-on-failure: true
      - name: Install Tauri dependencies
        timeout-minutes: 16
        run: bash scripts/linux/install-ci-deps.sh --smoke
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:coverage:rust
      - name: Upload available coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-linux
          path: coverage/
          # Setup/test failures may leave no reports. Preserve that first error,
          # but still require coverage when all preceding steps succeeded.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
      - name: Verify bundled native WeiDU
        run: |
          test -x src-tauri/resources/weidu/linux-amd64/weidu
          src-tauri/resources/weidu/linux-amd64/weidu --version
          python3 scripts/linux/weidu-smoke.py
      - name: Build unsigned Linux Debian package
        # tauri:build also typechecks/builds the frontend; do it once.
        run: npm run tauri:build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check package contents and desktop startup
        run: bash scripts/linux/package-smoke.sh
      - name: Verify AppImage updater signing with disposable keys
        run: bash scripts/linux/signing-smoke.sh
      - name: Check AppImage startup and native commands
        run: bash scripts/linux/appimage-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debian-test-build
          path: .cache/linux-check/
          if-no-files-found: error
