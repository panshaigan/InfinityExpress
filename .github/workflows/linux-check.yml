name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify bundled native WeiDU
        run: |
          test -x src-tauri/resources/weidu/linux-amd64/weidu
          src-tauri/resources/weidu/linux-amd64/weidu --version
      - name: Build unsigned Linux Debian package
        run: npm run tauri:build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debian-test-build
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
