name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:rust
      - name: Build isolated per-user NSIS test installer
        run: npm run tauri:build -- --bundles nsis --config scripts/windows/tauri.smoke.conf.json
      - name: Install, exercise WebView2/native dialogs/IPC, and uninstall
        run: npm run test:installer:windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-smoke
          path: .cache/windows-installer/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-windows
          path: coverage/frontend/
          if-no-files-found: error
