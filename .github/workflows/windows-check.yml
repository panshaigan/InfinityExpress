name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:rust
      - name: Build production Windows executable and resources
        run: npm run tauri:build -- --no-bundle
      - name: Exercise production WebView2 and native commands
        run: npm run test:desktop:windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-smoke
          path: .cache/windows-check/
          if-no-files-found: warn
