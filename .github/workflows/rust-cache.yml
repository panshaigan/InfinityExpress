name: Warm Rust caches

# Tags cannot restore another tag's caches. Populate the default-branch cache
# when dependencies/CI change so subsequent release tags can reuse it.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '**/rust-toolchain*'
      - '**/.cargo/config*'
      - '.github/workflows/**'
      - 'scripts/linux/install-ci-deps.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ runner.os }}
          workspaces: |
            src-tauri -> target
            src-tauri -> target/llvm-cov-target
          cache-on-failure: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 16
        run: bash scripts/linux/install-ci-deps.sh
      - run: npm ci
      - name: Warm production Rust dependencies without packaging
        run: npm run tauri:build -- --no-bundle
      - name: Warm Windows test dependencies without running tests
        if: runner.os == 'Windows'
        run: npm run test:rust -- --no-run
      - name: Warm instrumented Linux test dependencies
        if: runner.os == 'Linux'
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --locked --no-report
