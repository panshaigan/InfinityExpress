[[permission]]
identifier = "allow-list-subdir-names"
description = "List immediate subdirectory names under a user-chosen path"
commands.allow = ["list_subdir_names"]

[[permission]]
identifier = "allow-read-text-file"
description = "Read a UTF-8 text file from an absolute path"
commands.allow = ["read_text_file"]

[[permission]]
identifier = "allow-file-is-nonempty"
description = "Check whether a file exists and has length greater than zero"
commands.allow = ["file_is_nonempty"]

[[permission]]
identifier = "allow-read-text-file-tail"
description = "Read the last portion of a UTF-8 text file from an absolute path"
commands.allow = ["read_text_file_tail"]

[[permission]]
identifier = "allow-write-text-file-path"
description = "Write a UTF-8 text file at an absolute path (create parents)"
commands.allow = ["write_text_file"]

[[permission]]
identifier = "allow-append-text-file"
description = "Append UTF-8 text to a file at an absolute path (create parents)"
commands.allow = ["append_text_file"]

[[permission]]
identifier = "allow-ensure-dir"
description = "Create a directory and parents at an absolute path"
commands.allow = ["ensure_dir"]

[[permission]]
identifier = "allow-validate-creatable-dir"
description = "Validate a folder path that may be created (parent must exist)"
commands.allow = ["validate_creatable_dir"]

[[permission]]
identifier = "allow-game-dir-has-weidu-log"
description = "Check whether a game folder contains WeiDU.log"
commands.allow = ["game_dir_has_weidu_log"]

[[permission]]
identifier = "allow-dir-is-empty"
description = "Check whether a path is missing or an empty directory"
commands.allow = ["dir_is_empty"]

[[permission]]
identifier = "allow-remove-mod-dir"
description = "Recursively delete a named folder under the mods download directory"
commands.allow = ["remove_mod_dir"]

[[permission]]
identifier = "allow-probe-mod-remote"
description = "Probe remote mod version and download metadata"
commands.allow = ["probe_mod_remote"]

[[permission]]
identifier = "allow-acquire-mod"
description = "Download and extract a mod into the mods download directory"
commands.allow = ["acquire_mod"]

[[permission]]
identifier = "allow-cancel-mod-acquire"
description = "Abort the in-flight mod download"
commands.allow = ["cancel_mod_acquire"]

[[permission]]
identifier = "allow-scrape-mod-page-meta"
description = "Fetch page title and readme hints from a mod URL"
commands.allow = ["scrape_mod_page_meta"]

[[permission]]
identifier = "allow-weidu-install"
description = "List WeiDU components, run install steps, stage mods, cleanup"
commands.allow = [
  "list_weidu_components",
  "list_weidu_languages",
  "run_weidu_step",
  "run_weidu_force_uninstall",
  "send_weidu_stdin",
  "cancel_weidu_step",
  "stage_mod_into_game_dir",
  "cleanup_install_artifacts",
  "read_game_weidu_log",
  "read_game_exe_version",
]

[[permission]]
identifier = "allow-weidu-backup"
description = "Backup and restore game directories for installation"
commands.allow = [
  "backup_game_dir",
  "restore_game_dir",
  "list_backups",
  "create_named_backup",
  "delete_backup",
  "prepare_project_destination",
]

[[permission]]
identifier = "allow-take-fresh-install-env-flag"
description = "Read-once IE_FRESH_INSTALL env flag for dev localStorage wipe"
commands.allow = ["take_fresh_install_env_flag"]

[[permission]]
identifier = "allow-play-system-sound"
description = "Play a short OS system sound for unfocused toast announcements"
commands.allow = ["play_system_sound"]
