[[permission]]
identifier = "allow-list-subdir-names"
description = "List immediate subdirectory names under a user-chosen path"
commands.allow = ["list_subdir_names"]

[[permission]]
identifier = "allow-remove-mod-dir"
description = "Recursively delete a named folder under the mods download directory"
commands.allow = ["remove_mod_dir"]

[[permission]]
identifier = "allow-probe-mod-remote"
description = "Probe remote mod version and download metadata"
commands.allow = ["probe_mod_remote"]

[[permission]]
identifier = "allow-acquire-mod"
description = "Download and extract a mod into the mods download directory"
commands.allow = ["acquire_mod"]

[[permission]]
identifier = "allow-cancel-mod-acquire"
description = "Abort the in-flight mod download"
commands.allow = ["cancel_mod_acquire"]

[[permission]]
identifier = "allow-scrape-mod-page-meta"
description = "Fetch page title and readme hints from a mod URL"
commands.allow = ["scrape_mod_page_meta"]
